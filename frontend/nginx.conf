server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/..., nginx forwards to the api
    # container on the compose network, so no CORS is involved.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached so a new deploy is picked up;
    # the hashed JS/CSS bundles it references can be cached safely.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths serve the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
